[project]
name = "smbt-backend"
version = "2.0.0"
description = "Live, stateless market turning-point research API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "exchange_calendars>=4.5",
    "websockets>=13",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
