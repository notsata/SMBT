name: windows-app
on:
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", "frontend/**", "packaging/**", "sample-data/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: SMBT-Setup, path: dist/SMBT-Setup.exe, retention-days: 30 }

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: SMBT-Setup }
      - name: Install silently (per-user, no admin)
        shell: pwsh
        run: Start-Process -Wait -FilePath .\SMBT-Setup.exe -ArgumentList '/S'
      - name: Launch the installed app and probe it
        shell: pwsh
        env: { SMBT_NO_BROWSER: "1" }
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\SMBT"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\SMBT.lnk")) { throw "desktop shortcut missing" }
          $p = Start-Process -PassThru -FilePath "$inst\python\python.exe" -ArgumentList '-m','app.desktop' `
               -WorkingDirectory "$inst\backend" -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { if ((Invoke-RestMethod http://127.0.0.1:8765/api/health).ok) { $ok = $true; break } } catch {}; Start-Sleep 2 }
          if (-not $ok) { Get-Content out.txt, err.txt; throw "server did not start" }
          $ov = Invoke-RestMethod http://127.0.0.1:8765/api/overview
          "overview: $($ov.symbol) $($ov.as_of) regime=$($ov.cards.regime.display) bottom=$($ov.cards.bottom.value)"
          if ((Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode -ne 200) { throw "UI not served" }
          $bt = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"strategy":"trend200","symbol":"^GSPC"}' http://127.0.0.1:8765/api/backtest
          "walk-forward OOS days: $($bt.oos.n_days)"
          if ($bt.oos.n_days -lt 1000) { throw "backtest failed" }
          Start-Sleep 60
          "ingestion status: $((Invoke-RestMethod http://127.0.0.1:8765/api/admin/ingest) | ConvertTo-Json -Compress)"
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:LOCALAPPDATA\SMBT\smbt.log" -Tail 15
