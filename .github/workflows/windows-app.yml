name: windows-app
on:
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", "frontend/**", "packaging/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: SMBT-Setup, path: dist/SMBT-Setup.exe, retention-days: 30 }

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: SMBT-Setup }
      - name: Install silently (per-user, no admin)
        shell: pwsh
        run: Start-Process -Wait -FilePath .\SMBT-Setup.exe -ArgumentList '/S'
      - name: Launch the installed app and probe it
        shell: pwsh
        env: { SMBT_NO_BROWSER: "1" }
        run: |
          $inst = "$env:LOCALAPPDATA\Programs\SMBT"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\SMBT.lnk")) { throw "desktop shortcut missing" }
          $p = Start-Process -PassThru -FilePath "$inst\python\python.exe" -ArgumentList '-m','app.desktop' `
               -WorkingDirectory "$inst\backend" -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { if ((Invoke-RestMethod http://127.0.0.1:8765/api/health).ok) { $ok = $true; break } } catch {}; Start-Sleep 2 }
          if (-not $ok) { Get-Content out.txt, err.txt; throw "server did not start" }
          if ((Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode -ne 200) { throw "UI not served" }
          $st = Invoke-RestMethod http://127.0.0.1:8765/api/status
          "session: $($st.session.session)  access: $($st.licensing.access_mode)  streams: $($st.streams.Count)"
          # Keyless live source: official Cboe VIX history fetched over the internet right now (nothing bundled).
          $vix = Invoke-RestMethod http://127.0.0.1:8765/api/chart/%5EVIX
          "VIX via $($vix.provider): $($vix.bars.Count) sessions through $($vix.last_confirmed)"
          if ($vix.provider -ne "cboe" -or $vix.bars.Count -lt 5000) { throw "Cboe VIX history not fetched" }
          # Without equity keys the dashboard must say so (503), never show bundled or invented prices.
          try { Invoke-RestMethod http://127.0.0.1:8765/api/overview | Out-Null; throw "overview answered without a price provider" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 503) { throw } ; "overview without keys: 503 as expected" }
          Stop-Process -Id $p.Id -Force
          Get-Content out.txt, err.txt -Tail 15   # the app logs to its console window; no log file is written
