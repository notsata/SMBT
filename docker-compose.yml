services:
  db:
    image: timescale/timescaledb:latest-pg16  # pin a specific tag for production
    environment:
      POSTGRES_DB: smbt
      POSTGRES_USER: smbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smbt -d smbt"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smbt:${POSTGRES_PASSWORD}@db:5432/smbt
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.cli", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smbt:${POSTGRES_PASSWORD}@db:5432/smbt
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
